    <script>
        window.originalImage = window.Image;
        window.Image = function(width, height) {
            let image = window.originalImage(width, height);
            image.crossOrigin = "anonymous";
            return image;
        }
        document.originalCreate = document.createElement;
        document.createElement = function(tagName, options) {
            let element = document.originalCreate(tagName, options);
            if (tagName == "img") element.crossOrigin = "anonymous";
            return element;
        }
    </script>
